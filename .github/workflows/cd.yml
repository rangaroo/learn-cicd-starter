name: Set up CD

on:
  push:
    branches: [main]

jobs:
  set_up:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build the app
        run: scripts/buildprod.sh

      - name: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Build the Docker image and push it to Google Artifacts Registry'
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-479720/notely-ar-repo/bjorn234/notely:latest .

      - name: Run migrations script
        run: scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-479720/notely-ar-repo/bjorn234/notely:latest --region us-central1 --allow-unauthenticated --project notely-479720 --max-instances=4
