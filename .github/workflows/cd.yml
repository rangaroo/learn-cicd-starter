name: Set up CD

on:
  push:
    branches: [main]

jobs:
  set_up:
    name: Set up CD
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build the app
        run: scripts/buildprod.sh
